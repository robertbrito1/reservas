{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title mb-4 text-center">Iniciar sesión</h3>
                        {% if form.errors %}
                            <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="id_username" class="form-label">Usuario</label>
                                <input type="text" name="username" autofocus required class="form-control" id="id_username">
                            </div>
                            <div class="mb-3">
                                <label for="id_password" class="form-label">Contraseña</label>
                                <input type="password" name="password" required class="form-control" id="id_password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-2">Entrar</button>
                        </form>
                        <a href="/cliente/" class="btn btn-outline-secondary w-100">Entrar como cliente</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
